# NEON GRID – Apache snippet. Put these lines inside your <VirtualHost> block
# (ideally the HTTPS one), then:
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# The game is then reachable at https://your-domain/neongrid/

# Live game connection (WebSocket) and the account/highscore API go to the Python server.
ProxyPass        /neongrid/ws   ws://127.0.0.1:8765/ws
ProxyPass        /neongrid/api/ http://127.0.0.1:8765/api/
ProxyPassReverse /neongrid/api/ http://127.0.0.1:8765/api/

# The page itself (HTML, CSS, JS, font) is served by Apache.
Alias /neongrid /var/www/neongrid
<Directory /var/www/neongrid>
    Require all granted
    Options -Indexes
</Directory>
